name: Continuous Delivery
permissions:
  contents: read

on:
  push:
    branches: ["release/v*"]
  schedule:
    # Weekly snapshot validation (canary): Monday 6am UTC.
    # Runs only the snapshot-capture steps (no archive / ASC upload / TestFlight)
    # and validates the screenshots. Override: github.event_name == 'schedule'
    # (or `SNAPSHOT_VALIDATION_ONLY=true` via workflow_dispatch) selects this mode.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      SNAPSHOT_VALIDATION_ONLY:
        description: "Run only snapshot capture + validation (no build / no upload). Default on; select 'false' for a full release build."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requires-integration-tests:
    # Integration tests only gate a real release build.
    if: startsWith(github.ref_name, 'release/v') && github.event_name == 'push'
    uses: bikeindex/bike_index_ios/.github/workflows/integration.yml@main
    secrets: inherit

  build-release:
    name: Build release archive and distribute
    runs-on: macos-26
    needs: requires-integration-tests
    # Release pushes and manual dispatch run the full flow; scheduled runs are
    # snapshot-validation canaries only.
    #
    # `always()` keeps this job alive when the integration gate is skipped
    # (non-push events like schedule / workflow_dispatch). A *failed* gate
    # still blocks: the guard below re-checks the gate's result in release mode
    # before any destructive step runs.
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref_name, 'release/v')) ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule')
    steps:
      # Release mode must not proceed if the integration gate failed (the job
      # runs thanks to `always()`). Snapshot-validation mode ignores the gate.
      - name: Enforce integration gate (release mode)
        if: startsWith(github.ref_name, 'release/v') && needs.requires-integration-tests.result != 'success'
        run: exit 1

      - name: Select flow (release vs. snapshot validation)
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          DISPATCH_ONLY: ${{ inputs.SNAPSHOT_VALIDATION_ONLY }}
        id: flow
        run: |
          if [ "$SCHEDULED" = "true" ] || [ "$DISPATCH_ONLY" = "true" ]; then
            echo "SNAPSHOT_VALIDATION_ONLY=true" >> "$GITHUB_OUTPUT"
          else
            echo "SNAPSHOT_VALIDATION_ONLY=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      # ─── Snapshot validation (always) ─────────────────────────────────

      - name: Set Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # Snapshot runs against the sandbox env (host + seeded OAuth creds come
      # from #include "Default" / Default.xcconfig). Empty Honeybadger key on
      # purpose: canary screenshots don't need error reporting.
      - name: Set up development + production xcconfigs (sandbox)
        uses: ./.github/actions/setup-xcconfig
        with:
          environments: development production
          honeybadger_api_key: ""

      - name: Capture snapshots
        run: fastlane snapshot

      - name: Validate snapshots
        run: |
          # Expect one PNG per (ScreenshotUITest method x Snapfile device):
          # 5 test methods (main content, register bike, bike detail,
          # sticker details, sticker center) x 4 devices = 20
          ruby scripts/validate-screenshots.rb fastlane/screenshots 20

      - name: Upload snapshots as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-${{ github.sha }}
          path: fastlane/screenshots/**/*.png
          retention-days: 30

      - name: Upload test results (.xcresult) for diagnosis
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: |
            build/test-output/**/*.xcresult
            fastlane/screenshots/test_output/**/*.xcresult
          if-no-files-found: warn
          retention-days: 14

      # Validation-only flow ends here (weekly canary / manual dispatch).
      # All release-mode steps below are gated on steps.flow.outputs.

      # ─── Release build and distribution ───────────────────────────────

      - name: Strip SnapshotPreviews package
        if: steps.flow.outputs.SNAPSHOT_VALIDATION_ONLY != 'true'
        run: |
          brew install swift-sh
          ./scripts/release/strip-SnapshotPreviews.swift BikeIndex.xcodeproj
          xcodebuild -resolvePackageDependencies
      - name: Load API key and xcconfig
        if: steps.flow.outputs.SNAPSHOT_VALIDATION_ONLY != 'true'
        env:
          MATCH_API_KEY_JSON_CONTENT: ${{ secrets.MATCH_API_KEY_JSON_CONTENT }}
          API_SECRET: ${{ secrets.PRODUCTION__API_SECRET }}
          API_CLIENT_ID: ${{ secrets.PRODUCTION__API_CLIENT_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          HONEYBADGER_API_KEY: ${{ secrets.HONEYBADGER_API_KEY }}
        run: |
          echo "$MATCH_API_KEY_JSON_CONTENT" > ./fastlane/api-key.json
          # Rewrite the production xcconfig fresh (the sandbox block above
          # already generated one); API_HOST/API_PORT come from #include "Default".
          {
            echo '#include "Default"'
            echo "API_SECRET = $API_SECRET"
            echo "API_CLIENT_ID = $API_CLIENT_ID"
            echo "DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM"
            echo "HONEYBADGER_API_KEY = $HONEYBADGER_API_KEY"
          } > BikeIndex-production.xcconfig
      - name: Validate production xcconfig
        if: steps.flow.outputs.SNAPSHOT_VALIDATION_ONLY != 'true'
        run: ./scripts/validate-xcconfig.sh production
      - name: Set up keychain and codesigning
        if: steps.flow.outputs.SNAPSHOT_VALIDATION_ONLY != 'true'
        env:
          CODESIGNING_IOS_READ_TOKEN: ${{ secrets.CODESIGNING_IOS_READ_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: "true"
        run: |
          sed -i.bak "s/git_url.*/git_url\(\"https:\/\/${GITHUB_ACTOR}:${CODESIGNING_IOS_READ_TOKEN}@github.com\/bikeindex\/codesigning_ios.git\"\)/g" fastlane/Matchfile
          fastlane CD_setup_keychain_and_codesigning
      - name: Build release archive
        if: steps.flow.outputs.SNAPSHOT_VALIDATION_ONLY != 'true'
        run: fastlane CD_build_release_archive
      - name: Calculate delivery changes
        if: steps.flow.outputs.SNAPSHOT_VALIDATION_ONLY != 'true'
        run: git diff > delivery-changes.patch
      - uses: actions/upload-artifact@v7
        if: success() && steps.flow.outputs.SNAPSHOT_VALIDATION_ONLY != 'true'
        with:
          name: ${{ github.sha }}-artifact
          path: |
            BikeIndex.app.dSYM.zip
            BikeIndex.ipa
            ~/Library/Developer/Xcode/Archives/*
            delivery-changes.patch
          compression-level: 9
