name: Continuous Integration
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_call: # allows delivery.yml to invoke test-suite
  schedule:
    - cron: '0 13 * * 4' # Thursday 9:00 AM EDT (13:00 UTC)

jobs:
  build-tests:
    name: Build project and cache build products
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Set Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Install tools
        run: brew bundle install
      - name: Set up xcconfigs
        uses: ./.github/actions/setup-xcconfig
        with:
          honeybadger_api_key: ${{ secrets.HONEYBADGER_API_KEY }}
      - name: List available simulators
        run: xcodebuild -scheme BikeIndex -project BikeIndex.xcodeproj -showdestinations
      - name: Validate failed-test selector parser (self-test)
        run: ruby scripts/failed-test-configurations.rb --self-test
      - name: Build
        run: fastlane scan --build_for_testing=true
      - name: Save build products directory
        id: cache-build-save
        uses: actions/cache/save@v5
        with:
          path: build
          key: cache-build-${{ github.sha }}

  test-suite:
    needs: build-tests
    runs-on: xcode-27
    name: ${{ matrix.device }} ${{ matrix.only-testing }} ${{ matrix.deployment_target_version }}
    # Still-failing tests (post-retry), newline-separated "<target>/<class>/<method>".
    outputs:
      failed-tests: ${{ steps.collect-failed.outputs.failed-tests }}
    strategy:
      matrix:
        device: ["iPhone 17"] # "iPhone 17 Pro", "iPad (A16)"
        deployment_target_version: ["27.0"]
        only-testing: ["UnitTests", "UITests"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Set Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Restore cached build products
        id: cache-build-restore
        uses: actions/cache/restore@v5
        with:
          path: build
          key: cache-build-${{ github.sha }}
      - name: Set up xcconfigs
        uses: ./.github/actions/setup-xcconfig
        with:
          honeybadger_api_key: ${{ secrets.HONEYBADGER_API_KEY }}
      - name: ${{ matrix.only-testing}} on ${{ matrix.device }} ${{ matrix.deployment_target_version }}
        run: fastlane scan --only-testing="${{ matrix.only-testing }}" --device="${{ matrix.device }}" --deployment-target-version="${{ matrix.deployment_target_version }}" --test_without_building=true
      - name: Collect still-failing tests
        id: collect-failed
        if: failure()
        env:
          DEVICE: ${{ matrix.device }}
          ONLY_TESTING: ${{ matrix.only-testing }}
        run: |
          set -euo pipefail
          report="fastlane/test_output/test_output_${DEVICE}_${ONLY_TESTING}/report.junit"
          if [ ! -f "$report" ]; then
            echo "no JUnit report at $report; nothing to re-run" >&2
            printf 'failed-tests<<EOF\nEOF\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          failed=$(ruby scripts/failed-test-configurations.rb "$report")
          printf 'failed-tests<<EOF\n%s\nEOF\n' "$failed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test_output_${{ matrix.device }}_${{ matrix.only-testing }}
          path: "fastlane/test_output/*"
          compression-level: 9 # maximum compression

  # Re-run only the still-failing tests; skipped when test-suite passed.
  retry-failed-tests:
    needs: [build-tests, test-suite]
    if: always() && needs.test-suite.result == 'failure' && needs.test-suite.outputs['failed-tests'] != ''
    # Must match the build-tests image/Xcode so --test_without_building works on
    # the cached build products. See build-tests.
    runs-on: xcode-27
    name: Retry failed ${{ matrix.only-testing }} on ${{ matrix.device }}
    strategy:
      matrix:
        device: ["iPhone 17"] # "iPhone 17 Pro", "iPad (A16)"
        deployment_target_version: ["27.0"]
        only-testing: ["UnitTests", "UITests"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Set Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Install tools
        run: brew bundle install
      - name: Restore cached build products
        id: cache-build-restore
        uses: actions/cache/restore@v5
        with:
          path: build
          key: cache-build-${{ github.sha }}
      - name: Set up xcconfigs
        uses: ./.github/actions/setup-xcconfig
        with:
          honeybadger_api_key: ${{ secrets.HONEYBADGER_API_KEY }}
      - name: Retry only the failing tests
        id: retry
        env:
          FAILED_TESTS: ${{ needs.test-suite.outputs['failed-tests'] }}
          ONLY_TESTING: ${{ matrix.only-testing }}
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          # Selectors are "<Target>/<Class>/<method>" where <Target> is the value
          # passed to --only-testing (UnitTests | UITests). Keep only this cell's.
          cell_selectors="$(printf '%s\n' "$FAILED_TESTS" | grep -E "^${ONLY_TESTING}/" | tr '\n' ' ' | sed 's/ $//')"
          if [ -z "$cell_selectors" ]; then
            # If the whole run reported no failures at all, there is legitimately
            # nothing to retry. If failures exist for *other* cells only, that is
            # fine too (this cell passed). Only warn when the reported selectors
            # exist but none match this cell, which would indicate a selector bug.
            if [ -z "$(printf '%s' "$FAILED_TESTS")" ]; then
              echo "no failing tests reported; nothing to retry" >&2
            else
              echo "::warning::failed-tests reported but none match ${ONLY_TESTING}: $(printf '%s' "$FAILED_TESTS" | tr '\n' ' ')"
            fi
            exit 0
          fi
          fastlane scan \
            --only-test-configurations="$cell_selectors" \
            --device="${DEVICE}" \
            --deployment-target-version="${{ matrix.deployment_target_version }}" \
            --test_without_building=true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retry_test_output_${{ matrix.device }}_${{ matrix.only-testing }}
          path: "fastlane/test_output/*"
          compression-level: 9 # maximum compression
