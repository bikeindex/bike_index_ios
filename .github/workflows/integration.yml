name: Continuous Integration
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_call: # allows delivery.yml to invoke test-suite
  schedule:
    - cron: '0 13 * * 4' # Thursday 9:00 AM EDT (13:00 UTC)

jobs:
  build-tests:
    name: Build project and cache build products
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Set Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Install tools
        run: brew bundle install
      - name: Set up xcconfigs
        uses: ./.github/actions/setup-xcconfig
        with:
          honeybadger_api_key: ${{ secrets.HONEYBADGER_API_KEY }}
      - name: List available simulators
        run: xcodebuild -scheme BikeIndex -project BikeIndex.xcodeproj -showdestinations
      - name: Validate failed-test selector parser (self-test)
        run: ruby scripts/failed-test-configurations.rb --self-test
      - name: Build
        run: fastlane scan --build_for_testing=true
      - name: Save build products directory
        id: cache-build-save
        uses: actions/cache/save@v5
        with:
          path: build
          key: cache-build-${{ github.sha }}

  test-unit:
    needs: build-tests
    runs-on: xcode-27
    timeout-minutes: 180
    name: ${{ matrix.device }} UnitTests ${{ matrix.deployment_target_version }}
    # Still-failing tests (post-retry), newline-separated "<target>/<class>/<method>".
    outputs:
      failed-tests: ${{ steps.collect-failed.outputs.failed-tests }}
    strategy:
      matrix:
        device: ["iPhone 17"] # "iPhone 17 Pro", "iPad (A16)"
        deployment_target_version: ["27.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Set Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Install tools
        run: brew bundle install
      - name: Restore cached build products
        id: cache-build-restore
        uses: actions/cache/restore@v5
        with:
          path: build
          key: cache-build-${{ github.sha }}
      - name: Set up xcconfigs
        uses: ./.github/actions/setup-xcconfig
        with:
          honeybadger_api_key: ${{ secrets.HONEYBADGER_API_KEY }}
      - name: UnitTests on ${{ matrix.device }} ${{ matrix.deployment_target_version }}
        run: fastlane scan --only-testing="UnitTests" --device="${{ matrix.device }}" --deployment-target-version="${{ matrix.deployment_target_version }}" --test_without_building=true
      - name: Collect still-failing tests
        id: collect-failed
        if: failure()
        run: |
          set -euo pipefail
          # scan writes the JUnit to <output_directory>/report.junit. The default
          # output_directory is fastlane/test_output (see fastlane/Scanfile) -- NOT
          # a per-device/per-target subdirectory. A wrong path leaves failed-tests
          # empty, which silently skips the retry job.
          report="fastlane/test_output/report.junit"
          if [ ! -f "$report" ]; then
            echo "no JUnit report at $report; nothing to re-run" >&2
            printf 'failed-tests<<EOF\nEOF\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The target (first selector segment) is known here; pass it explicitly.
          failed="$(ruby scripts/failed-test-configurations.rb "$report" "UnitTests")"
          echo "still-failing UnitTests:"; printf '%s\n' "$failed"
          printf 'failed-tests<<EOF\n%s\nEOF\n' "$failed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test_output_${{ matrix.device }}_UnitTests
          path: "fastlane/test_output/*"
          compression-level: 9 # maximum compression

  test-ui:
    # UITests only run when UnitTests pass. A failing unit test indicates a
    # broken build or API contract that makes UI test results meaningless.
    needs: [build-tests, test-unit]
    runs-on: xcode-27
    timeout-minutes: 180
    name: ${{ matrix.device }} UITests ${{ matrix.deployment_target_version }}
    # Still-failing tests (post-retry), newline-separated "<target>/<class>/<method>".
    outputs:
      failed-tests: ${{ steps.collect-failed.outputs.failed-tests }}
    strategy:
      matrix:
        device: ["iPhone 17"] # "iPhone 17 Pro", "iPad (A16)"
        deployment_target_version: ["27.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Set Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Install tools
        run: brew bundle install
      - name: Restore cached build products
        id: cache-build-restore
        uses: actions/cache/restore@v5
        with:
          path: build
          key: cache-build-${{ github.sha }}
      - name: Set up xcconfigs
        uses: ./.github/actions/setup-xcconfig
        with:
          honeybadger_api_key: ${{ secrets.HONEYBADGER_API_KEY }}
      - name: UITests on ${{ matrix.device }} ${{ matrix.deployment_target_version }}
        run: fastlane scan --only-testing="UITests" --device="${{ matrix.device }}" --deployment-target-version="${{ matrix.deployment_target_version }}" --test_without_building=true
      - name: Collect still-failing tests
        id: collect-failed
        if: failure()
        run: |
          set -euo pipefail
          # scan writes the JUnit to <output_directory>/report.junit. The default
          # output_directory is fastlane/test_output (see fastlane/Scanfile) -- NOT
          # a per-device/per-target subdirectory. A wrong path leaves failed-tests
          # empty, which silently skips the retry job.
          report="fastlane/test_output/report.junit"
          if [ ! -f "$report" ]; then
            echo "no JUnit report at $report; nothing to re-run" >&2
            printf 'failed-tests<<EOF\nEOF\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The target (first selector segment) is known here; pass it explicitly.
          failed="$(ruby scripts/failed-test-configurations.rb "$report" "UITests")"
          echo "still-failing UITests:"; printf '%s\n' "$failed"
          printf 'failed-tests<<EOF\n%s\nEOF\n' "$failed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test_output_${{ matrix.device }}_UITests
          path: "fastlane/test_output/*"
          compression-level: 9 # maximum compression

  # Re-run only the still-failing tests; skipped when test jobs passed.
  retry-unit:
    needs: [build-tests, test-unit]
    if: always() && needs.test-unit.result == 'failure' && needs.test-unit.outputs['failed-tests'] != ''
    # Must match the build-tests image/Xcode so --test_without_building works on
    # the cached build products. See build-tests.
    runs-on: xcode-27
    timeout-minutes: 30
    name: Retry failed UnitTests on ${{ matrix.device }}
    # Tests still failing after the retry (newline-separated selectors). Emitted
    # even when the retry step times out or is killed, so the "still failing
    # post-retry" signal is never lost.
    outputs:
      still-failing: ${{ steps.collect-failed.outputs.still-failing }}
    strategy:
      matrix:
        device: ["iPhone 17"]
        deployment_target_version: ["27.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Set Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Install tools
        run: brew bundle install
      - name: Restore cached build products
        id: cache-build-restore
        uses: actions/cache/restore@v5
        with:
          path: build
          key: cache-build-${{ github.sha }}
      - name: Set up xcconfigs
        uses: ./.github/actions/setup-xcconfig
        with:
          honeybadger_api_key: ${{ secrets.HONEYBADGER_API_KEY }}
      - name: Retry failing UnitTests
        id: retry
        # Bound the retry. A hanging/stalling test (e.g. a snapshot test tripping
        # the plan timeout) must not run the job to the 2h+ runner watchdog; a
        # bounded step fails fast and the collect step below still captures the
        # post-retry JUnit and still-failing list. 30m sits above the observed
        # 18-33m failing-retry baseline (gives a slow-but-legit pass headroom)
        # while still cutting the 134m hang by ~70%.
        timeout-minutes: 30
        env:
          FAILED_TESTS: ${{ needs.test-unit.outputs['failed-tests'] }}
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          selectors="$(printf '%s\n' "$FAILED_TESTS" | grep -E '^UnitTests/' || true)"
          if [ -z "$selectors" ]; then
            echo "no failing UnitTests selectors; nothing to retry" >&2
            exit 0
          fi
          # -only-testing (NOT -only-test-configuration, which selects test-plan
          # configurations, not tests) takes <Target>/<Class>/<Method> identifiers.
          # Snapshot-test method names contain spaces (e.g. "portrait-Main Content
          # Page-0-16"), so a single space-joined value is ambiguous. xcodebuild
          # reads a newline-delimited response file via -only-testing:@<file>,
          # treating each line as one full identifier (internal spaces preserved).
          # $GITHUB_WORKSPACE is preserved across steps (mktemp is not), so the
          # post-retry collect step can re-read these expected selectors to run
          # the vacuous-run guard.
          identifiers="${GITHUB_WORKSPACE}/.retry-unit-expected.txt"
          printf '%s\n' "$selectors" > "$identifiers"
          echo "retrying UnitTests:"; cat "$identifiers"
          fastlane scan \
            --xcargs="-only-testing:@$identifiers" \
            --device="${DEVICE}" \
            --deployment-target-version="${{ matrix.deployment_target_version }}" \
            --test_without_building=true
      - name: Collect still-failing tests (post-retry)
        id: collect-failed
        # Always run: on retry success there is nothing to report; on failure or
        # timeout it captures the JUnit and emits the still-failing selectors so
        # the outcome is visible even when the retry step is killed mid-run.
        if: always()
        run: |
          set -uo pipefail
          report="fastlane/test_output/report.junit"
          if [ ! -f "$report" ]; then
            echo "no post-retry JUnit at $report (retry step may have been killed before scan wrote it)" >&2
            printf 'still-failing<<EOF\nEOF\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          still="$(ruby scripts/failed-test-configurations.rb "$report" "UnitTests")"
          echo "still-failing UnitTests after retry:"
          if [ -n "$still" ]; then printf '%s\n' "$still"; else echo "  (none -- retry passed)"; fi
          printf 'still-failing<<EOF\n%s\nEOF\n' "$still" >> "$GITHUB_OUTPUT"
          # Vacuous-run guard: prove the -only-testing selectors actually matched
          # a test. A malformed selector makes scan run zero tests and "pass",
          # masking the real failure -- fail loudly instead.
          expected="${GITHUB_WORKSPACE}/.retry-unit-expected.txt"
          if [ -f "$expected" ] && [ -n "$(cat "$expected" 2>/dev/null)" ]; then
            if ! ruby scripts/failed-test-configurations.rb --guard "$report" "UnitTests" "$expected"; then
              echo "::error::retry-unit guard failed: expected selectors matched no executed test (vacuous retry)" >&2
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retry_test_output_${{ matrix.device }}_UnitTests
          path: "fastlane/test_output/*"
          compression-level: 9 # maximum compression

  retry-ui:
    needs: [build-tests, test-ui]
    if: always() && needs.test-ui.result == 'failure' && needs.test-ui.outputs['failed-tests'] != ''
    # Must match the build-tests image/Xcode so --test_without_building works on
    # the cached build products. See build-tests.
    runs-on: xcode-27
    timeout-minutes: 30
    name: Retry failed UITests on ${{ matrix.device }}
    # Tests still failing after the retry (newline-separated selectors). Emitted
    # even when the retry step times out or is killed, so the "still failing
    # post-retry" signal is never lost.
    outputs:
      still-failing: ${{ steps.collect-failed.outputs.still-failing }}
    strategy:
      matrix:
        device: ["iPhone 17"]
        deployment_target_version: ["27.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Set Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Install tools
        run: brew bundle install
      - name: Restore cached build products
        id: cache-build-restore
        uses: actions/cache/restore@v5
        with:
          path: build
          key: cache-build-${{ github.sha }}
      - name: Set up xcconfigs
        uses: ./.github/actions/setup-xcconfig
        with:
          honeybadger_api_key: ${{ secrets.HONEYBADGER_API_KEY }}
      - name: Retry failing UITests
        id: retry
        # Bound the retry. A hanging/stalling test must not run the job to the
        # 2h+ runner watchdog; a bounded step fails fast and the collect step
        # below still captures the post-retry JUnit and still-failing list. 30m
        # sits above the observed 18-33m failing-retry baseline (gives a
        # slow-but-legit pass headroom) while still cutting the 134m hang by ~70%.
        timeout-minutes: 30
        env:
          FAILED_TESTS: ${{ needs.test-ui.outputs['failed-tests'] }}
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          selectors="$(printf '%s\n' "$FAILED_TESTS" | grep -E '^UITests/' || true)"
          if [ -z "$selectors" ]; then
            echo "no failing UITests selectors; nothing to retry" >&2
            exit 0
          fi
          # -only-testing (NOT -only-test-configuration, which selects test-plan
          # configurations, not tests) takes <Target>/<Class>/<Method> identifiers.
          # Method names can contain spaces, so a single space-joined value is
          # ambiguous. xcodebuild reads a newline-delimited response file via
          # -only-testing:@<file>, treating each line as one full identifier.
          # $GITHUB_WORKSPACE is preserved across steps (mktemp is not), so the
          # post-retry collect step can re-read these expected selectors to run
          # the vacuous-run guard.
          identifiers="${GITHUB_WORKSPACE}/.retry-ui-expected.txt"
          printf '%s\n' "$selectors" > "$identifiers"
          echo "retrying UITests:"; cat "$identifiers"
          fastlane scan \
            --xcargs="-only-testing:@$identifiers" \
            --device="${DEVICE}" \
            --deployment-target-version="${{ matrix.deployment_target_version }}" \
            --test_without_building=true
      - name: Collect still-failing tests (post-retry)
        id: collect-failed
        # Always run: on retry success there is nothing to report; on failure or
        # timeout it captures the JUnit and emits the still-failing selectors so
        # the outcome is visible even when the retry step is killed mid-run.
        if: always()
        run: |
          set -uo pipefail
          report="fastlane/test_output/report.junit"
          if [ ! -f "$report" ]; then
            echo "no post-retry JUnit at $report (retry step may have been killed before scan wrote it)" >&2
            printf 'still-failing<<EOF\nEOF\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          still="$(ruby scripts/failed-test-configurations.rb "$report" "UITests")"
          echo "still-failing UITests after retry:"
          if [ -n "$still" ]; then printf '%s\n' "$still"; else echo "  (none -- retry passed)"; fi
          printf 'still-failing<<EOF\n%s\nEOF\n' "$still" >> "$GITHUB_OUTPUT"
          # Vacuous-run guard: prove the -only-testing selectors actually matched
          # a test. A malformed selector makes scan run zero tests and "pass",
          # masking the real failure -- fail loudly instead.
          expected="${GITHUB_WORKSPACE}/.retry-ui-expected.txt"
          if [ -f "$expected" ] && [ -n "$(cat "$expected" 2>/dev/null)" ]; then
            if ! ruby scripts/failed-test-configurations.rb --guard "$report" "UITests" "$expected"; then
              echo "::error::retry-ui guard failed: expected selectors matched no executed test (vacuous retry)" >&2
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retry_test_output_${{ matrix.device }}_UITests
          path: "fastlane/test_output/*"
          compression-level: 9 # maximum compression
